<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sujan Chapagain — Agricultural Researcher specializing in plant pathology, crop stress, and plant breeding.">
    <meta name="author" content="Sujan Chapagain">

    <title>Sujan Chapagain | Agricultural Researcher</title>

    <!-- Google Fonts: Bebas Neue for Big Bold Headers & Inter for Clean Nav/Body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* =========================================================
           GLOBAL RESETS & FONTS
           ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            color: #222222;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 17px;
            line-height: 1.65;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================================================
           TOP INSTITUTIONAL BAR
           ========================================================= */
        .top-bar {
            background-color: #111111;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222222;
        }

        .top-bar a {
            color: #ffffff;
            text-decoration: underline;
        }

        .top-bar .search-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* =========================================================
           MAIN BRANDING HEADER
           ========================================================= */
        .brand-header {
            background-color: #f4f4f4;
            padding: 24px 40px;
            border-bottom: 1px solid #e2e2e2;
        }

        .brand-header h1 {
            font-family: 'Bebas Neue', cursive, sans-serif;
            font-size: 56px;
            font-weight: 400;
            letter-spacing: 1.5px;
            color: #111111;
            line-height: 1;
        }

        /* =========================================================
           PROMINENT & LARGE NAVIGATION BAR
           ========================================================= */
        .main-nav {
            background-color: #ba0c2f; /* UGA Red */
            padding: 0 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-menu li a {
            display: block;
            padding: 16px 22px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 21px; /* BIG TEXT SIZE */
            font-weight: 800; /* BOLD */
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .nav-menu li a:hover,
        .nav-menu li.active a {
            background-color: #8b0000;
            color: #ffffff;
        }

        /* =========================================================
           HERO BANNER
           ========================================================= */
        .hero-banner {
            max-width: 1300px;
            margin: 25px auto 0;
            position: relative;
            height: 400px;
            background: #222 url('Image/aa.webp') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .hero-caption {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.82);
            color: #ffffff;
            padding: 18px 30px;
            text-align: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 1.2px;
        }

        /* =========================================================
           MAIN CONTENT AREA
           ========================================================= */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 46px;
            letter-spacing: 1px;
            color: #111111;
            margin-bottom: 15px;
            border-bottom: 3px solid #ba0c2f;
            display: inline-block;
            padding-bottom: 2px;
        }

        .about-text {
            font-size: 18px;
            color: #333333;
            line-height: 1.8;
            margin-top: 15px;
            text-align: justify;
        }

        /* =========================================================
           COMPLETED PROJECTS
           ========================================================= */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 25px;
        }

        .project-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .project-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .project-card-content {
            padding: 20px;
        }

        .project-card h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 0.5px;
            color: #ba0c2f;
            margin-bottom: 8px;
        }

        .project-card p {
            font-size: 15px;
            color: #555555;
            line-height: 1.5;
        }

        /* =========================================================
           RESEARCH HIGHLIGHTS
           ========================================================= */
        .highlights-section {
            background-color: #f8f8f8;
            border-top: 1px solid #e5e5e5;
            border-bottom: 1px solid #e5e5e5;
            padding: 50px 0;
            margin-top: 40px;
        }

        .highlights-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 35px;
            padding: 0 20px;
        }

        .highlight-box h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 0.8px;
            color: #111111;
            margin-bottom: 10px;
        }

        .highlight-box p {
            font-size: 16px;
            color: #444444;
            line-height: 1.6;
        }

        /* =========================================================
           FOOTER
           ========================================================= */
        .footer-info {
            background-color: #eeeeee;
            padding: 45px 20px;
            border-top: 1px solid #dddddd;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }

        .footer-left h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 0.8px;
            color: #111111;
            margin-bottom: 5px;
        }

        .footer-left p {
            font-size: 15px;
            color: #444444;
            margin-bottom: 4px;
        }

        .footer-left a {
            color: #ba0c2f;
            font-weight: 600;
            text-decoration: underline;
        }

        .footer-right {
            text-align: right;
        }

        .footer-right h4 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            letter-spacing: 0.5px;
            color: #111111;
        }

        .social-links {
            margin-top: 12px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .social-links a {
            width: 42px;
            height: 42px;
            background: #111111;
            color: #ffffff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .social-links a:hover {
            background: #ba0c2f;
            transform: translateY(-2px);
        }

        .copyright-bar {
            background-color: #000000;
            color: #ffffff;
            font-size: 13px;
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-to-top {
            background-color: #ba0c2f;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .nav-menu li a {
                font-size: 18px;
                padding: 12px 14px;
            }
            .footer-container {
                grid-template-columns: 1fr;
            }
            .footer-right {
                text-align: left;
            }
            .social-links {
                justify-content: flex-start;
            }
        }
    </style>
</head>
